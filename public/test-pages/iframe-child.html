<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iframe child</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main data-testid="payment-frame">
      <section>
        <h1>Payment frame</h1>
        <label>
          Card number
          <input data-testid="card-number" name="cardNumber" placeholder="4242 4242 4242 4242" />
        </label>
        <button type="button" aria-label="Submit payment">Pay now</button>
      </section>
      <section>
        <h2>Frame pseudo table</h2>
        <div
          class="pseudo-table-grid"
          data-testid="iframe-pseudo-table"
          role="table"
          aria-label="Frame release readiness"
        >
          <div role="columnheader">Name</div>
          <div role="columnheader">Status</div>
          <div role="cell">Alpha</div>
          <div role="cell">Ready</div>
          <div role="cell">Beta</div>
          <div role="cell">Blocked</div>
        </div>
      </section>
      <iframe title="Payment verification frame" src="./iframe-nested.html"></iframe>
    </main>
  </body>
</html>
