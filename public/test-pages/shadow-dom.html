<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shadow DOM - UI Explorer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main data-testid="shadow-page">
      <h1>Shadow DOM</h1>
      <p class="muted">Open roots can be traversed; closed roots should be reported as limited.</p>
      <section>
        <h2>Open component</h2>
        <open-widget data-testid="open-widget"></open-widget>
      </section>
      <section>
        <h2>Nested open component</h2>
        <nested-widget></nested-widget>
      </section>
      <section>
        <h2>Closed component</h2>
        <closed-widget data-ui-explorer-closed-shadow></closed-widget>
      </section>
    </main>

    <script>
      customElements.define(
        "open-widget",
        class extends HTMLElement {
          connectedCallback() {
            const root = this.attachShadow({ mode: "open" });
            root.innerHTML = `
              <style>
                button { min-height: 36px; border: 1px solid #147876; border-radius: 6px; padding: 0 12px; background: #147876; color: white; }
                label { display: grid; gap: 6px; }
                .pseudo-table-grid {
                  display: grid;
                  grid-template-columns: minmax(120px, 1fr) minmax(120px, 1fr);
                  margin-top: 14px;
                  border: 1px solid #c8d0c7;
                  border-radius: 6px;
                  overflow: hidden;
                }
                .pseudo-table-grid > * { padding: 8px 10px; border-right: 1px solid #c8d0c7; border-bottom: 1px solid #c8d0c7; }
                .pseudo-table-grid > [role="columnheader"] { background: #e8eee9; font-weight: 600; }
              </style>
              <label>
                Shadow query
                <input data-testid="shadow-query" aria-label="Shadow query" placeholder="inside open root" />
              </label>
              <button type="button" part="action">Shadow action</button>
              <button type="button" data-testid="phase-8-diagnostic-target" data-phase="shadow">
                Phase 8 Shadow diagnostic target
              </button>
              <div
                class="pseudo-table-grid"
                data-testid="shadow-pseudo-table"
                role="table"
                aria-label="Shadow release readiness"
              >
                <div role="columnheader">Name</div>
                <div role="columnheader">Status</div>
                <div role="cell">Alpha</div>
                <div role="cell">Ready</div>
                <div role="cell">Beta</div>
                <div role="cell">Blocked</div>
              </div>
            `;
          }
        }
      );

      customElements.define(
        "nested-widget",
        class extends HTMLElement {
          connectedCallback() {
            const root = this.attachShadow({ mode: "open" });
            root.innerHTML = `<open-widget data-testid="nested-open-widget"></open-widget>`;
          }
        }
      );

      customElements.define(
        "closed-widget",
        class extends HTMLElement {
          connectedCallback() {
            const root = this.attachShadow({ mode: "closed" });
            root.innerHTML = `<button type="button">Closed action</button>`;
          }
        }
      );
    </script>
  </body>
</html>
