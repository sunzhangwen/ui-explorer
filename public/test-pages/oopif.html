<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI Explorer OOPIF Parent Fixture</title>
    <link rel="stylesheet" href="/test-pages/styles.css" />
    <style>
      iframe {
        width: min(760px, 100%);
        height: 430px;
        border: 3px solid #5ec7b8;
        border-radius: 12px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cross-site iframe / OOPIF</h1>
      <p>
        The parent and child alternate between <code>localhost</code> and
        <code>127.0.0.1</code> while keeping the current port.
      </p>
      <iframe
        id="oopif-frame"
        title="OOPIF payment fixture"
        data-testid="oopif-frame"
      ></iframe>
    </main>
    <script>
      const childHost =
        location.hostname === "127.0.0.1" ? "localhost" : "127.0.0.1";
      const childUrl =
        `${location.protocol}//${childHost}:${location.port}` +
        "/test-pages/oopif-child.html";
      document.querySelector("#oopif-frame").src = childUrl;
    </script>
  </body>
</html>
